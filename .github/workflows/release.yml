# Publishes a DokuQuest release whenever a new game file is pushed to release/dokuquest.html.
# The game file carries the whole project inside it, so this rebuilds the project from it, packages the
# desktop apps when the app itself changed since the last release, and publishes the release that the
# desktop launcher updates from. (Made by tools/ghpush.sh in the project; kept in tools/github/.)
name: Publish release
on:
  push:
    branches: [main]
    paths: ['release/dokuquest.html']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rebuild the project from the game file
        run: |
          python3 release/restore.py release/dokuquest.html build
          mkdir -p build/launcher/icons && cp release/icons/* build/launcher/icons/
          cd build && node tools/build.js
          # the game must come out the same (the compressed copy of the tools may differ by zlib build)
          if ! cmp -s <(grep -v 'id="dq-sources"' dist/dokuquest.html) <(grep -v 'id="dq-sources"' ../release/dokuquest.html); then
            echo "::error::The rebuilt game differs from release/dokuquest.html"; exit 1
          fi
      - name: Cache Electron and AppImage tools
        uses: actions/cache@v4
        with:
          path: |
            build/.cache/*.zip
            build/.cache/appimagetool-x86_64.AppImage
            build/.cache/runtime-x86_64
          key: dq-tools-${{ hashFiles('build/tools/package.sh') }}
      - name: Package (when the app changed) and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: cd build && bash tools/publish.sh "${{ github.repository }}"
